schema_version: "1.0"

corpus:
  path: input/PorSimplesSent/corpus.jsonl
  id_field: production_id
  text_field: original_text

execution:
  directory: output/porsimplessent-nemotron-runs
  results_filename: results.jsonl
  metadata_filename: metadata_per_text.csv

workflow:
  max_revisions: 3
  branches:
    - branch_id: simple
      target_audience: "Estudantes, acadêmicos e profissionais da área."
      intensity: light
    - branch_id: moderate
      target_audience: "Jornalistas e profissionais de comunicação."
      intensity: moderate
    - branch_id: aggressive
      target_audience: "Público geral"
      intensity: strong

prompts:
  analyzer: prompts/analisador.txt
  simplifier: prompts/simplificador.txt
  evaluator: prompts/avaliador.txt

models:
  analyzer:
    name: nvidia/nemotron-3-nano-30b-a3b
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    request_timeout_seconds: 180
    technical_retries: 2
    retry_backoff_seconds: 1.0
    temperature: 0.0
    max_tokens: 2048
    top_p: 1.0
    # O nemotron "come" os tokens com o reasoning, não sobrando para gerar as simplificações
    reasoning_effort: none
    supports_structured_output: true
  simplifier:
    name: nvidia/nemotron-3-nano-30b-a3b
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    request_timeout_seconds: 180
    technical_retries: 2
    retry_backoff_seconds: 1.0
    temperature: 0.1
    max_tokens: 4096
    top_p: 1.0
    reasoning_effort: none
    supports_structured_output: false
  evaluator:
    name: nvidia/nemotron-3-nano-30b-a3b
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    request_timeout_seconds: 180
    technical_retries: 2
    retry_backoff_seconds: 1.0
    temperature: 0.0
    max_tokens: 2048
    top_p: 1.0
    reasoning_effort: none
    supports_structured_output: true
