[project]
name = "linguagem-simples-graph"
version = "0.1.0"
description = "Harness de simplificação e avaliação de textos jurídicos em português brasileiro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.15.0",
    "langchain>=1.3.12",
    "langchain-openai>=1.3.4",
    "langchain-openrouter>=0.2.6",
    "langgraph>=1.2.8",
    "nltk>=3.10.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
# Stack GPU separado: Linux x86_64/Python 3.12; não instala CUDA no macOS.
# vLLM fixa torch/torchaudio/torchvision compatíveis nas dependências transitivas.
hpc = [
    "vllm==0.8.5.post1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "ray[default]==2.43.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "transformers>=4.51.1,<4.52; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
analysis = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "scipy>=1.14,<2",
]
metrics = [
    "bert-score>=0.3.13,<0.4",
    "transformers>=4.38,<5",
    "sentencepiece>=0.2,<0.3",
    # PyTorch 2.2.2 é a última versão com wheels para macOS Intel (Python até 3.12).
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<4.45; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
# Serving GPU e BERTScore legado (macOS Intel) usam stacks distintos.
conflicts = [[{ extra = "hpc" }, { extra = "metrics" }]]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
