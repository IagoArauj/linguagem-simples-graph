schema_version: "1.0"

corpus:
  path: input/PorSimplesSent/corpus.jsonl
  id_field: production_id
  text_field: original_text

execution:
  directory: output/hpc-porsimplessent-runs
  results_filename: results.jsonl
  metadata_filename: metadata_per_text.csv

workflow:
  max_revisions: 3
  branches:
    - branch_id: simple
      target_audience: "Estudantes, acadêmicos e profissionais da área."
      intensity: light
    - branch_id: moderate
      target_audience: "Jornalistas e profissionais de comunicação."
      intensity: moderate
    - branch_id: aggressive
      target_audience: "Público geral"
      intensity: strong

prompts:
  analyzer: prompts/analisador.txt
  simplifier: prompts/simplificador.txt
  evaluator: prompts/avaliador.txt

# HTTP e pipeline rodam no mesmo nó. A chave é gerada no ambiente do job;
# localhost mantém a configuração estável se uma retomada usar outro nó.
models:
  analyzer:
    name: Qwen/Qwen3-32B
    provider: openai_compatible
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
    request_timeout_seconds: 180
    technical_retries: 2
    retry_backoff_seconds: 2
    temperature: 0.1
    max_tokens: 8192
    supports_structured_output: true
  simplifier:
    name: Qwen/Qwen3-32B
    provider: openai_compatible
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
    request_timeout_seconds: 180
    technical_retries: 2
    retry_backoff_seconds: 2
    temperature: 0.3
    max_tokens: 4096
    supports_structured_output: false
  evaluator:
    name: Qwen/Qwen3-32B
    provider: openai_compatible
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
    request_timeout_seconds: 180
    technical_retries: 2
    retry_backoff_seconds: 2
    temperature: 0.0
    max_tokens: 8192
    supports_structured_output: true
